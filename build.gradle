plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-fabric"
}

repositories {
    maven {
        name = "Xaero's Maven"
        url = 'https://chocolateminecraft.com/maven'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    implementation "xaero.map:xaeroworldmap-fabric-${xaero_map_version}"
    implementation "xaero.minimap:xaerominimap-fabric-${xaero_minimap_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}


tasks.withType(Jar).configureEach {
    archiveVersion.set("${project.minecraft_version}-${project.mod_version}")
}

publishMods {
    file = tasks.named('remapJar').flatMap { it.archiveFile }
    version = "${project.minecraft_version}-${project.mod_version}"
    displayName = tasks.named('remapJar').flatMap { it.archiveFile }.map { it.asFile.name }
    type = STABLE
    modLoaders.add("fabric")
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = "1787408"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("CURSEFORGE_TOKEN"))
        minecraftVersions.add(project.minecraft_version)
        client = true
        server = false
        requires("fabric-api")
        requires("xaeros-minimap")
        requires("xaeros-world-map")
    }
}
