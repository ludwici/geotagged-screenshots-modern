plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-fabric"
}

repositories {
    maven {
        name = "Xaero's Maven"
        url = 'https://chocolateminecraft.com/maven'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "xaero.map:xaeroworldmap-fabric-${xaero_map_version}"
    modImplementation "xaero.minimap:xaerominimap-fabric-${xaero_minimap_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

