plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge"
}

repositories {
    maven {
        name = "Xaero's Maven"
        url = 'https://chocolateminecraft.com/maven'
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "xaero.map:xaeroworldmap-neoforge-$rootProject.xaero_map_version"
    compileOnly "xaero.minimap:xaerominimap-neoforge-$rootProject.xaero_minimap_version"

    runtimeOnly "xaero.map:xaeroworldmap-neoforge-$rootProject.xaero_map_version"
    runtimeOnly "xaero.minimap:xaerominimap-neoforge-$rootProject.xaero_minimap_version"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}



tasks.withType(Jar).configureEach {
    archiveVersion.set("${project.minecraft_version}-${project.mod_version}")
}

publishMods {
    changelog = ""
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    version = "${project.minecraft_version}-${project.mod_version}"
    displayName = tasks.named('jar', Jar).flatMap { it.archiveFile }.map { it.asFile.name }
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = providers.gradleProperty("publishDryRun").map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = "1787408"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("CURSEFORGE_TOKEN"))
        minecraftVersions.add(project.minecraft_version)
        client = true
        server = false
        requires("xaeros-minimap")
        requires("xaeros-world-map")
    }
}
