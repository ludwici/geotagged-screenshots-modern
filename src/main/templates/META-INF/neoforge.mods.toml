modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/ludwici/geotagged-screenshots-modern/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/ludwici/geotagged-screenshots-modern"
authors="${mod_authors}"
iconFile="logo.png"
bannerFile="logo.png"
displayTest="IGNORE_SERVER_VERSION"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="xaeroworldmap"
type="required"
versionRange="[1.47.2,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="xaerominimap"
type="required"
versionRange="[26.6.2,)"
ordering="NONE"
side="CLIENT"
