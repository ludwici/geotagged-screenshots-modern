name: One-time CurseForge 26.1.2 release

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/curseforge-26-1-2-release.yml

permissions:
  contents: read

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish Geotagged Screenshots Modern 26.1.2 to CurseForge [user-requested]'
    name: Publish 26.1.2 ${{ matrix.loader }} to CurseForge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neo]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 26.1.2-${{ matrix.loader }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.loader == 'fabric' && '9.7.0' || '9.5.1' }}
      - name: Check CurseForge API token
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: test -n "$CURSEFORGE_TOKEN"
      - name: Publish only to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: gradle clean publishMods --no-daemon --stacktrace
