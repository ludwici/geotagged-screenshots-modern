name: NeoForge 26.3 Build

on:
  push:
    branches:
      - 26.3-neo
  pull_request:
    branches:
      - 26.3-neo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Inspect Xaero API
        run: gradle inspectXaero --no-daemon
      - name: Build NeoForge mod
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: geotagged-screenshots-modern-26.3-neoforge
          path: build/libs/*.jar
          if-no-files-found: error
