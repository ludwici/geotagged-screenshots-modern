name: Fabric 1.21.1 Build

on:
  push:
    branches:
      - 1.21.1-fabric
  pull_request:
    branches:
      - 1.21.1-fabric
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Verify Xaero APIs
        run: gradle verifyXaeroApis --no-daemon
      - name: Build Fabric mod and run tests
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload Fabric JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: geotagged-screenshots-modern-1.21.1-fabric
          path: build/libs/*-fabric-*.jar
          if-no-files-found: error
