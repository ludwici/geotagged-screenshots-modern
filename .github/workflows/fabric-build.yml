name: Fabric 26.3 Build

on:
  push:
    branches:
      - 26.3-fabric
  pull_request:
    branches:
      - 26.3-fabric
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Inspect Xaero API
        run: gradle inspectXaero --no-daemon
      - name: Build Fabric mod and run tests
        run: gradle clean build --no-daemon --stacktrace
      - name: Upload Fabric JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: geotagged-screenshots-26.3-fabric
          path: build/libs/*-fabric-*.jar
          if-no-files-found: error
