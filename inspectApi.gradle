tasks.register('inspectApi') {
    doLast {
        def classes = [
                'net.minecraft.client.Screenshot',
                'net.minecraft.client.Minecraft',
                'net.minecraft.client.gui.GuiGraphicsExtractor',
                'net.minecraft.client.gui.screens.Screen',
                'net.minecraft.client.renderer.texture.DynamicTexture',
                'net.minecraft.client.renderer.texture.TextureManager',
                'net.minecraft.network.chat.ClickEvent',
                'net.minecraft.resources.Identifier',
                'com.mojang.blaze3d.platform.NativeImage',
                'xaero.map.mods.gui.WaypointRenderer',
                'xaero.map.mods.gui.WaypointRenderContext',
                'xaero.map.mods.gui.Waypoint',
                'xaero.map.mods.SupportXaeroMinimap',
                'xaero.map.mods.SupportMods',
                'xaero.map.core.XaeroWorldMapCore',
                'xaero.common.minimap.waypoints.Waypoint',
                'xaero.hud.minimap.waypoint.set.WaypointSet'
        ]
        def suffixes = ['WaypointWorld.class', 'MapElementRenderer.class', 'MapElementReader.class', 'MapElementRenderProvider.class', 'GuiMap.class', 'GuiGraphicsExtractor.class', 'KeyEvent.class', 'Identifier.class', 'Util.class', 'WaypointSet.class', 'Screenshot.class', 'RenderFrameEvent.class']
        def jars = configurations.compileClasspath.resolve().findAll { it.name.endsWith('.jar') }
        println("API_INSPECT_CLASSPATH_JARS " + jars.size())
        def inspectCount = 0
        jars.each { f ->
            def zip = new java.util.zip.ZipFile(f)
            try {
                def matches = zip.entries().findAll { e ->
                    !e.directory && suffixes.any { suffix -> e.name.endsWith(suffix) }
                }.collect { it.name }
                if (!matches.isEmpty()) {
                    println("API_INSPECT_JAR " + f.absolutePath)
                    matches.take(90).each { println("API_CLASS " + it) }
                }
                for (String clazz : classes) {
                    if (zip.getEntry(clazz.replace('.', '/') + '.class') != null) {
                        def process = new ProcessBuilder('javap', '-classpath', f.absolutePath, '-public', clazz).redirectErrorStream(true).start()
                        def output = process.inputStream.text.readLines().take(100).join('\n')
                        process.waitFor()
                        println("API_JAVAP " + clazz + "\n" + output)
                        inspectCount++
                    }
                }
            } finally {
                zip.close()
            }
        }
        println("API_INSPECT_MATCHED " + inspectCount)
    }
}
