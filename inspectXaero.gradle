tasks.register('inspectXaero') {
    doLast {
        def classes = ["xaero.map.mods.gui.WaypointReader","xaero.hud.minimap.waypoint.render.WaypointMapRenderer","xaero.hud.minimap.waypoint.render.WaypointMapRenderReader","xaero.map.mods.gui.WaypointRenderer","xaero.map.element.MapElementGraphics","xaero.hud.minimap.element.render.MinimapElementRenderInfo","net.minecraft.client.gui.GuiGraphicsExtractor","net.minecraft.client.gui.screens.Screen"]
        def jars = configurations.compileClasspath.resolve().findAll { it.name.endsWith('.jar') && it.isFile() }
        jars.each { jar ->
            def zip = new java.util.zip.ZipFile(jar)
            try {
                classes.each { clazz ->
                    if (zip.getEntry(clazz.replace('.', '/') + '.class') != null) {
                        def proc = new ProcessBuilder('javap','-classpath',jar.absolutePath,'-private','-s',clazz).redirectErrorStream(true).start()
                        def output = proc.inputStream.text.readLines()
                        proc.waitFor()
                        println("XAERO_BEGIN " + clazz)
                        output.each { println(it) }
                        println("XAERO_END " + clazz)
                    }
                }
            } finally {
                zip.close()
            }
        }
    }
}
