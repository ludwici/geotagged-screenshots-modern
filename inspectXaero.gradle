tasks.register('inspectXaero') {
    doLast {
        def targets = [
            'xaero.map.mods.gui.WaypointReader',
            'xaero.map.mods.gui.WaypointRenderProvider',
            'xaero.map.mods.gui.Waypoint',
            'xaero.map.element.MapElementReader',
            'xaero.map.element.MapElementRenderer',
            'xaero.map.element.HoveredMapElementHolder',
            'xaero.map.element.render.ElementReader',
            'xaero.map.element.render.ElementRenderer',
            'xaero.map.gui.GuiMap',
            'xaero.hud.minimap.waypoint.WaypointRenderInfo',
            'xaero.hud.minimap.waypoint.render.WaypointMapRenderer',
            'xaero.hud.minimap.waypoint.render.WaypointMapRenderReader',
            'xaero.hud.minimap.waypoint.render.WaypointMapRenderContext',
            'xaero.hud.minimap.waypoint.render.WaypointMapRenderProvider',
            'xaero.common.minimap.waypoints.render.WaypointsIngameRenderer',
            'xaero.common.minimap.waypoints.render.WaypointsGuiRenderer',
            'xaero.hud.minimap.waypoint.render.AbstractWaypointRenderContext',
            'xaero.hud.minimap.waypoint.render.AbstractWaypointRenderProvider',
            'xaero.hud.minimap.waypoint.render.WaypointRenderProvider'
        ]
        configurations.compileClasspath.resolve().findAll { it.name.toLowerCase().contains('xaero') && it.name.endsWith('.jar') }.each { jar ->
            def zip = new java.util.zip.ZipFile(jar)
            try {
                targets.each { clazz ->
                    if (zip.getEntry(clazz.replace('.', '/') + '.class') != null) {
                        def proc = new ProcessBuilder('javap','-classpath',jar.absolutePath,'-private',clazz).redirectErrorStream(true).start()
                        def output = proc.inputStream.text.readLines().take(185)
                        proc.waitFor()
                        println("XAERO_CLASS_START " + clazz)
                        output.each { println(it) }
                        println("XAERO_CLASS_END " + clazz)
                    }
                }
                ['xaero.map.mods.gui.WaypointReader','xaero.map.element.MapElementReader','xaero.map.element.render.ElementReader','xaero.hud.minimap.waypoint.render.WaypointMapRenderer'].each { clazz ->
                    if (zip.getEntry(clazz.replace('.', '/') + '.class') != null) {
                        def proc = new ProcessBuilder('javap','-classpath',jar.absolutePath,'-c','-p',clazz).redirectErrorStream(true).start()
                        def output = proc.inputStream.text.readLines()
                        proc.waitFor()
                        println("XAERO_BYTECODE_START " + clazz)
                        output.take(650).each { println(it) }
                        println("XAERO_BYTECODE_END " + clazz)
                    }
                }
            } finally {
                zip.close()
            }
        }
    }
}
